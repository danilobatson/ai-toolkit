name: CI

# `push` fires only for main. Every branch is covered by `pull_request` instead,
# because a push made with GITHUB_TOKEN does not trigger `push` workflows — so
# agent-opened PRs ran zero CI under the old `branches: ['**']`. PR #57's smoke
# test never executed once. `pull_request` is not suppressed that way.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:coverage
      - run: yarn semantic-checks
      - run: yarn build
      - name: Check dist has no orphans
        run: yarn check:orphan-dist
      - name: Bundle size
        run: du -sh packages/toolkit/dist/
      - name: License check
        run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/toolkit/coverage/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-size
          path: packages/toolkit/dist/
