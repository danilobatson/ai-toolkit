name: CI

# BOTH triggers are required; neither alone covers every author.
#   push          the assign-agent and humans. Their PRs need manual approval to
#                 run pull_request workflows, but their pushes run unblocked.
#   pull_request  the @claude mention path, whose pushes use GITHUB_TOKEN and so
#                 trigger no push workflows at all.
# The concurrency group collapses the duplicate run when both fire.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:coverage
      - run: yarn semantic-checks
      - run: yarn build
      - name: Check dist has no orphans
        run: yarn check:orphan-dist
      - name: Smoke-test built artifact
        run: yarn smoke:dist
      - name: Bundle size
        run: du -sh packages/toolkit/dist/
      - name: License check
        run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/toolkit/coverage/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-size
          path: packages/toolkit/dist/
