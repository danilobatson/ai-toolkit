name: CI

# push fires for main only; every branch is covered by pull_request.
#
# ⛔ Do NOT add `push: branches: ['**']` back. It was tried so the assign-agent's
# PRs would run without manual approval. The result: both events fired per
# branch, the concurrency group cancelled one, and a CANCELLED run renders as a
# red `fail` in PR checks — verified on #67 and #68. A red X on every PR is worse
# than the approval click it was meant to avoid. The mention path is the default
# and its pull_request runs need no approval.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test:coverage
      - run: yarn semantic-checks
      - run: yarn build
      - name: Check dist has no orphans
        run: yarn check:orphan-dist
      - name: Smoke-test built artifact
        run: yarn smoke:dist
      - name: Bundle size
        run: du -sh packages/toolkit/dist/
      - name: License check
        run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/toolkit/coverage/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-size
          path: packages/toolkit/dist/
