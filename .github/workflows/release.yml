name: Release

# Publishes packages/toolkit to npm. packages/cli is deliberately NOT published.
#
# 🔑 NPM_TOKEN must be a GRANULAR ACCESS TOKEN with "bypass 2FA" enabled.
#    A plain automation token is NOT enough — the account requires 2FA for
#    publish, and npm rejects it with:
#      E403 ... Two-factor authentication or granular access token with
#      bypass 2fa enabled is required to publish packages.
#    Create one at npmjs.com/settings/~/tokens/granular-access-tokens/new with
#    Read and write on @jamaalbuilds/ai-toolkit, and the 2FA bypass turned on.
#
# ⏳ IT ALSO EXPIRES. Created 2026-09-04 with a 90-day life, so it lapses around
#    2026-12-03. Nothing else in the repo depends on it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish to npm (leave unchecked to run every gate and stop)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      # ⛔ Do NOT add `registry-url:` here. It writes an .npmrc containing the
      # literal ${NODE_AUTH_TOKEN}, and yarn v1 tries to expand that during
      # `yarn install` before the variable exists:
      #   error Failed to replace env in config: ${NODE_AUTH_TOKEN}
      # The token is written straight to .npmrc at publish time instead.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # The tag is the only thing a human types, so it is the thing most likely
      # to be wrong. Without this, pushing v0.3.5 publishes whatever version the
      # manifest says — and an npm version is burned permanently once used.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/toolkit/package.json').version")
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"; exit 1; }

      # The same gate CI runs. Publishing is the one place where skipping it is
      # unrecoverable, and smoke:dist is the check that would have caught the
      # require()-in-ESM bug that shipped in 0.3.3.
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn semantic-checks
      - run: yarn build
      - run: yarn check:orphan-dist
      - run: yarn smoke:dist

      - name: Verify the tarball contents
        working-directory: packages/toolkit
        run: |
          npm pack --dry-run
          npm pack --dry-run --json | node -e "
            const f=JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(x=>x.path);
            const dist=f.filter(p=>p.startsWith('dist/'));
            if(!dist.length){console.error('::error::no dist/ files in tarball');process.exit(1)}
            console.log('tarball contains '+f.length+' files, '+dist.length+' under dist/');
          "

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        working-directory: packages/toolkit
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          set +e
          OUT=$(npm publish --access public --provenance 2>&1); CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            # Distinguish the three failures that look alike. A wrong hint sends
            # the next person after the wrong cause, which is worse than none.
            if echo "$OUT" | grep -qi "two-factor\|bypass 2fa"; then
              echo "::error::NPM_TOKEN is not a granular access token with 2FA bypass. This is NOT expiry — see the key note at the top of this file."
            elif echo "$OUT" | grep -qi "ENEEDAUTH\|401"; then
              echo "::error::npm rejected the token as invalid or expired. Mint a new one and replace the NPM_TOKEN secret."
            elif echo "$OUT" | grep -qi "cannot publish over\|previously published"; then
              echo "::error::This version already exists on npm. Bump the version in packages/toolkit/package.json and retag."
            else
              echo "::error::Publish failed for a reason not seen before — read the npm output above."
            fi
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Gate-only run — nothing published
        if: "!startsWith(github.ref, 'refs/tags/') && !inputs.publish"
        run: echo "Every gate passed and the tarball looks right. Re-run with 'publish' checked, or push a v* tag, to publish for real."
