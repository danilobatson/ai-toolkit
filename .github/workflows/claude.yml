name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # write so @claude can push a branch AND open the PR itself. Read-only got
      # us a branch plus a "Create PR" link (issue #33) — the last manual step.
      # ⚠️ Public repo. This is safe only because the action itself gates on the
      # TRIGGERING ACTOR's write access — a bot author was rejected on #44 with
      # "App token exchange failed: 401 - User does not have write access".
      # A drive-by commenter cannot drive it. Do not remove that assumption
      # without re-checking it.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Git identity for commits the agent makes. Defaults to claude[bot],
          # which is why merged commits read "claude[bot]" as author and why
          # GitHub added Co-authored-by: claude[bot] on squash. Setting the owner
          # here is the supported fix — --author in the system prompt only
          # affects commits it makes by hand, not the action's own git ops.
          bot_id: '69876068'
          bot_name: 'danilobatson'

          # One comment per run instead of a new one each time.
          use_sticky_comment: true
          # Puts the run report in the GitHub Step Summary, so "did it work"
          # is answerable from the Actions tab without reading the raw log.
          display_report: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Write permissions alone do NOT let it open a PR — the tool allowlist is
          # the real gate. On issue #13 it pushed a branch, then reported:
          #   "gh, yarn, npx and curl all required interactive approval that isn't
          #    available here ... gh pr create would need to be added to this
          #    workflow's allowed tools."
          # gh pr/issue: open and comment on its own work.
          # yarn:        run the checks CONTRIBUTING requires before a PR — it could
          #              not run tests or lint on #13 and had to say so in the body.
          # --append-system-prompt, not `prompt:` — `prompt:` REPLACES the
          # triggering comment's task. This adds to it.
          # CLAUDE.md alone was not enough: it opened the PR on one run (#63) and
          # handed back a "Create PR" link on two others with the rule in place.
          claude_args: >-
            --allowed-tools "Bash(gh pr:*),Bash(gh issue:*),Bash(yarn:*)"
            --append-system-prompt "Finishing the task means the pull request
            EXISTS. After you push, run `gh pr create` yourself with a conventional
            title and the filled .github/PULL_REQUEST_TEMPLATE.md body. Never end by
            replying with a 'Create PR' link or a bare pushed branch — that is an
            unfinished task, not a handoff.
            Commits are authored by Danilo Jamaal Batson, never by you: commit with
            `git commit --author=\"Danilo Jamaal Batson <69876068+danilobatson@users.noreply.github.com>\" -m \"<message>\"`.
            NEVER append a Co-authored-by trailer, for Claude or anyone. The action's
            own base prompt tells you to add one; this repo's CLAUDE.md forbids it and
            this instruction wins. Nothing goes after the commit message."

