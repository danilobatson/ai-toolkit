name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip the two authors this action structurally CANNOT review. It
    # authenticates as the triggering actor, so a PR author without write access
    # fails the app-token exchange — a check that can never pass, on every PR.
    #   dependabot[bot]  GitHub withholds secrets from its runs; token is empty.
    #   Claude           the assign-an-agent bot. Verified on #60:
    #                    "App token exchange failed: 401 - User does not have
    #                     write access", 3 attempts, then red.
    #
    # claude[bot] — the @claude MENTION path — is NOT skipped and works: #57 was
    # reviewed in 47s. The difference is which identity opens the PR.
    #
    # ⛔ Do NOT collapse this back to `user.type != 'Bot'`. That excluded every
    # agent PR including the mention path, so the PRs most worth reviewing were
    # the only ones never reviewed.
    # To review an assign-path PR, comment @claude on it — that fires as you.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'Claude'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Without this the action refuses a bot-opened PR outright:
          # "Workflow initiated by non-human actor: claude (type: Bot)" (#63).
          # Earlier successes were misleading — #57 reviewed off a human rebase
          # push and #61 was human-authored, so the actor was human both times.
          # The job-level `if:` above still excludes the authors that cannot auth.
          allowed_bots: 'claude'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # ⚠️ track_progress was tried here and reverted. Observed: it flips
          # "Auto-detected mode" from agent to tag, and tag mode waits for an
          # @claude mention rather than auto-reviewing. NOT fully proven — both
          # test runs were also stopped by the action's workflow-validation guard
          # (it refuses to run when a PR edits this file), so Claude never executed
          # in either. If you retry it, verify AFTER merging to main.
          #
          # ⛔ An earlier version of this comment claimed a clean review posts
          # nothing. That was wrong. Per the docs, --comment posts an inline
          # comment per finding OR one summary comment when it finds none.
          # The real reason a PR can get no comment: Claude skips drafts, closed
          # PRs, PRs it judges trivial or automated, and PRs it has already
          # commented on. #25 was judged trivial — correct behaviour, not a gap.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

