name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # ⛔ Skip ALL bot-authored PRs, not just Dependabot. Two distinct failures,
    # same root cause — a bot author cannot authenticate this action:
    #   dependabot[bot]        → secrets withheld from bot-triggered runs, so
    #                            CLAUDE_CODE_OAUTH_TOKEN is empty
    #   anthropic-code-agent   → "App token exchange failed: 401 Unauthorized -
    #                            User does not have write access" (PR #44)
    # The first version of this guard named dependabot only and had to be widened
    # when the second bot appeared. Match on author TYPE so the next one is covered.
    # Review a bot's PR on demand instead: comment @claude on it — the mention fires
    # as YOU, so secrets and write access resolve normally.
    if: github.event.pull_request.user.type != 'Bot'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # ⚠️ track_progress was tried here and reverted. Observed: it flips
          # "Auto-detected mode" from agent to tag, and tag mode waits for an
          # @claude mention rather than auto-reviewing. NOT fully proven — both
          # test runs were also stopped by the action's workflow-validation guard
          # (it refuses to run when a PR edits this file), so Claude never executed
          # in either. If you retry it, verify AFTER merging to main.
          #
          # Open problem: a review that finds nothing posts nothing, so "reviewed,
          # clean" and "never ran" look identical on the PR. Seen on #25 — a real
          # review (4 turns, 15s) that left no trace outside the Actions log.
          # use_sticky_comment is the untested candidate.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

