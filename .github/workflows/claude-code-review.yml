name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot only. Its runs are structurally unauthenticatable: GitHub
    # withholds secrets from Dependabot-triggered workflows, so
    # CLAUDE_CODE_OAUTH_TOKEN is empty no matter what this file says.
    #
    # ⛔ Do NOT widen this to `user.type != 'Bot'`. That is what it used to say, and
    # it silently excluded every agent-authored PR — the mention path opens as
    # claude[bot], the assign path as Claude — so the PRs most worth reviewing were
    # the only ones never reviewed. Bot authorship is not the failure; missing
    # secrets are, and only Dependabot has that problem by construction.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # ⚠️ track_progress was tried here and reverted. Observed: it flips
          # "Auto-detected mode" from agent to tag, and tag mode waits for an
          # @claude mention rather than auto-reviewing. NOT fully proven — both
          # test runs were also stopped by the action's workflow-validation guard
          # (it refuses to run when a PR edits this file), so Claude never executed
          # in either. If you retry it, verify AFTER merging to main.
          #
          # ⛔ An earlier version of this comment claimed a clean review posts
          # nothing. That was wrong. Per the docs, --comment posts an inline
          # comment per finding OR one summary comment when it finds none.
          # The real reason a PR can get no comment: Claude skips drafts, closed
          # PRs, PRs it judges trivial or automated, and PRs it has already
          # commented on. #25 was judged trivial — correct behaviour, not a gap.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

