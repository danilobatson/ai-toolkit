name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot: GitHub withholds secrets from its runs, so the app-token
    # exchange has nothing to exchange and the job can only ever fail.
    #
    # ⛔ Do NOT widen this to `user.type != 'Bot'`. That excluded every
    # agent-opened PR — the mention path opens as claude[bot] — so the PRs most
    # worth reviewing were the only ones never reviewed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress creates the tracking comment that
          # mcp__github_comment__update_claude_comment writes to — WITHOUT it the
          # job has no way to post anything except an inline comment on a diff
          # line, so a clean review is silent. Adding Bash(gh pr comment:*) did
          # not fix that: verified on #72, tool allowed and instruction present,
          # never invoked. The plugin's --comment flow just ends its turn.
          track_progress: true
          # Lets the reviewer read CI status and a failing job's log via the
          # mcp__github_ci__* tools instead of reviewing the diff blind.
          additional_permissions: |
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The trailing instruction is deliberate. A clean review posts NOTHING,
          # so "reviewed and found nothing" and "never ran" look identical from
          # the PR — verified on #68: 1m49s of real work, zero comments.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Always finish by posting exactly one summary comment with your verdict,
            even when you find nothing worth flagging. Say what you checked and that
            it came back clean. A silent pass is indistinguishable from a run that
            never happened.
          # Without this the action refuses a bot-opened PR outright:
          # "Workflow initiated by non-human actor: claude (type: Bot)" (#63).
          # Earlier successes were misleading — #57 reviewed off a human rebase
          # push and #61 was human-authored, so the actor was human both times.
          allowed_bots: 'claude'
          # ⚠️ Bash(gh pr comment:*) is what MAKES the "always post a verdict"
          # instruction above executable. The only other comment tool here is
          # create_inline_comment, which attaches to a diff line — so with a clean
          # review there is nothing to attach to and the run posted NOTHING.
          # Verified on #70/#71/#72: instruction present in the prompt, zero
          # permission denials, zero comments. It was unexecutable, not ignored.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"

          # ⚠️ track_progress was tried once before and reverted on the theory
          # that it flips the mode from agent to tag (which waits for an @claude
          # mention). That was never actually observed — both test runs were
          # stopped by the workflow-validation guard, so Claude never executed.
          # Re-enabled above and being verified from main this time. If reviews
          # stop firing on their own, this is the first thing to suspect.
          #
          # ⛔ This comment has now been wrong in both directions. Settled by
          # observation on #68: claude-review ran 1m49s, step conclusion success,
          # no validation skip, no auth error — and posted ZERO comments. So a
          # clean review IS silent; --comment does not emit a summary on its own.
          # Hence the explicit instruction in `prompt:` above.
          # Claude also skips drafts, closed PRs, and PRs it judges trivial
          # (#25) — those are separate reasons for silence and remain correct.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

